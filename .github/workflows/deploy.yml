name: Deploy

# Manual only. Run it from the Actions tab when you want the site published: "web" uploads the
# site, "full" also applies infrastructure changes.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options:
          - web
          - full
        default: web

permissions:
  id-token: write # sign in to AWS with OIDC (no stored AWS keys)
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      - run: yarn generate

      - name: Write infra config
        env:
          INFRA_CONFIG_JSON: ${{ secrets.INFRA_CONFIG_JSON }}
        run: |
          if [ -z "$INFRA_CONFIG_JSON" ]; then
            echo "::error::Add the INFRA_CONFIG_JSON repository secret (contents of infra/config.json)."
            exit 1
          fi
          printf '%s' "$INFRA_CONFIG_JSON" > infra/config.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2
          mask-aws-account-id: true # the logs are public

      - run: node scripts/deploy.mjs "$TARGET"
        env:
          TARGET: ${{ inputs.target }}
